          A legendary wave-riding destination in St Ives Bay, catching full Atlantic
          groundswell — long peeling waves that are perfect for surf-foiling.
          Reliability and clean air draw advanced riders looking for high-performance
          sessions. Active, passionate local community.
      ideal_wind: "W, NW — the prevailing winds, and the most consistent."
      wind_speed: "15-25kn for stable flight; 25-30kn+ for advanced wave riding."
      tide: "Best at low tide (+/-2hrs). Shore break at high tide is a major gear hazard."
      swell: "Powerful Atlantic groundswell, 1.0m-2.0m."
      overall: "Excellent. A world-class wave hub with a deeply expert community."
      crowds: "Welcoming, moderate. Popular on big forecasts, but the bay is vast."
      suitable_for: "Advanced. Powerful swell and currents require high-level wave skills."
      hazards: >-
        Powerful Atlantic swell, strong tidal currents, submerged rocks near Godrevy,
        heavy shore break at high tide.
      access: "Ample parking at the Gwithian dunes; launch from the sandy beach. Sandy bottom."
      parking: "Gwithian dunes car park."
      sources: ["knotnow.co.uk"]

  - id: bluff
    name: THE BLUFF
    lat: 50.1935
    lon: -5.4055
    character: flatwater
    swell_exposure: 0.15
    wave_school: false
    wind:
      ideal: [[303.75, 56.25]]                     # NW-NNW-N-NNE-NE
      ok: [[258.75, 303.75]]                       # W-WNW
      gusty: []
      offshore: [[56.25, 258.75]]
    tide:
      best: high
      avoid_hw_hours: 0
      avoid_lw_hours: 0
      rising_only: false
      flow_penalty: 0.40                 # estuary ebb is exceptionally strong
    notes:
      - "REQUIRES a Bluff pass + insurance — sort that before your first session."
      - "Tucked inside the estuary arm: flat when Gwithian next door is pumping."
      - "Ebb current is vicious and has caught out competent riders. Deep channels."
      - "Best at HIGH tide for foiling — Oscar's own experience, 2026-08-08:"
      - "the low-tide 'sandy lagoons' the guides rate are ankle-to-knee-deep, fine"
      - "for a kite twin-tip but not enough draft for a foil. Hits bottom a lot."
      - "This is the same spot Poseidon Watersports call 'Hayle Rivermouth' — where the"
      - "estuary meets the Atlantic. NW riders split between the north side (here, The"
      - "Bluff) and the south side ('The Poles') or ride between the two."
    guide:
      overview:
        - >-
          Poseidon Watersports' "location of choice" — often considered the best
          spot in Britain: a large expanse of varied water where the Hayle estuary
          meets the Atlantic. As the estuary emerges with NW winds, riders choose
          the north side (The Bluff, scored here), the south side ("The Poles"), or
          anywhere between, to find flat water, deep channels, and waves that peel
          left and right into a predictable shoulder.
      tide: "Best at high tide for foiling — see Oscar's firsthand note above."
      hazards: >-
        Vicious ebb current with deep channels — has caught out competent riders.
        Requires a Bluff pass and insurance.
      sources: ["poseidon-watersports.com"]


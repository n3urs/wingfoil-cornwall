  - id: pendennis
    # Scored at Pendennis Point (Oscar's confirmed launch), but this tile stands in
    # for "Falmouth" generally — Gyllyngvase and Royal Cornwall Yacht Club are two
    # other real launch options in the same town, close enough in character that they
    # don't earn their own scored tile. See guide.alternatives: the Guide panel lists
    # all three so you can pick the exact spot once you know the wind's roughly right.
    name: FALMOUTH — PENDENNIS POINT
    lat: 50.1487
    lon: -5.0420
    character: estuary
    swell_exposure: 0.30
    faces: 80           # beach faces roughly E, across Carrick Roads toward the Roseland
    wave_school: false
    wind:
      ideal: [[326.25, 56.25], [146.25, 213.75]]   # N-NNE-NE ("up the river") and S-SSW ("out to sea") —
                                                     # both along the channel, confirmed comfortable
      ok: [[56.25, 146.25]]                        # NE-ENE-E-ESE-SE: onshore, straight onto the beach —
                                                     # a long paddle out but workable, not dangerous
      gusty: []
      offshore: [[213.75, 326.25]]                 # SW-WSW-W-WNW-NW: blows off the headland itself,
                                                     # untested — the one direction not vouched for
    tide:
      best: any
      avoid_hw_hours: 0
      avoid_lw_hours: 0
      rising_only: false
      flow_penalty: 0.35                 # harbour-mouth tidal stream, stronger than Mylor's creek
    notes:
      - "Oscar's own account, 2026-08-08: launches right at the tip of Pendennis Point,"
      - "the side touching the river (Carrick Roads), not the open-bay side."
      - "Most directions work. Straight onshore (E) is annoying — long paddle out to"
      - "get going — but not dangerous. Wind up-river (N-ish) or out to sea (S-ish) is fine."
      - "W (blowing off the headland itself) hasn't been vouched for — marked offshore"
      - "as the conservative default until it's actually been tried."
      - "Coordinates are an estimate for 'the tip, river side' — precise enough for tide"
      - "station and swell grid cell, but nudge them if the map dot looks wrong."
      - "Tidal stream and boat/ferry traffic at the harbour mouth are real hazards"
      - "that don't apply at Mylor."
      - "Gyllyngvase Beach and Royal Cornwall Yacht Club are two other real Falmouth"
      - "launch options — similar enough not to need their own scored tile, but open"
      - "the Guide for wind/tide/hazard notes on all three so you can pick the exact spot."
    guide:
      overview:
        - >-
          This tile is scored at Pendennis Point, but "Falmouth" really has three
          viable launch points depending on wind direction and what you're after:
          Pendennis Point itself (river-side, Oscar's own confirmed spot — the
          numbers this dashboard scores), Gyllyngvase Beach (Falmouth's main
          beach, S/SE facing), and Royal Cornwall Yacht Club (Carrick Roads,
          more sheltered, sailable most tides). Check the wind direction against
          all three below before deciding where to rig.
      ideal_wind: "N-NNE-NE (up the river) or S-SSW (out to sea) at Pendennis — see alternatives for Gylly/RCYC."
      tide: "Any state works at Pendennis. See alternatives for Gylly (best low) and RCYC (best high)."
      hazards: "Harbour-mouth tidal stream and boat/ferry traffic at Pendennis — see each alternative for its own hazards."
      sources: ["knotnow.co.uk"]
      alternatives:
        - name: "Gyllyngvase Beach (Gylly)"
          overview: >-
            Falmouth's most popular beach for winging — sheltered relative to the
            open coast, safer sea state, crystal-clear water and a sandy bottom.
            Very busy; best off-season or early.
          ideal_wind: "S, SE (directly into the bay). Viable: SW, SSW, S, SSE, SE, ESE, E."
          wind_speed: "15-25kn sweet spot; 4-5m wings light air, 3m past 28kn."
          tide: "Best at low tide (+/-2hrs). Shore break best avoided at high tide with swell running."
          suitable_for: "Good for intermediates — deep water is great for foilers, but the shore dump needs timing."
          hazards: "Very high crowds, one of the busiest beaches in Cornwall."
          # Decorative only — not fed into the scoring engine, just draws this card's
          # compass/tide-bar in the Guide panel using the same visual language as the
          # scored spots. ideal = the two named directions; ok = the wider viable list.
          wind:
            ideal: [[168.75, 191.25], [123.75, 146.25]]   # S, SE
            ok: [[78.75, 236.25]]                          # E round through SE-S-SW
            gusty: []
            offshore: []
          tide_rule: { best: low, avoid_hw_hours: 2, avoid_lw_hours: 0, rising_only: false }
        - name: "Royal Cornwall Yacht Club"
          overview: >-
            RYA Champion Club, established 1871, overlooking the Fal Estuary and
            Carrick Roads — a professional, high-performance-training venue with
            an elite racing history.
          ideal_wind: "S, SW, NW — prevailing winds that funnel cleanly along Carrick Roads."
          wind_speed: "15-25kn sweet spot; 4-5m wings in lighter air."
          tide: "Sailable at all tides. High tide preferred for easier launch and to avoid the strongest currents."
          suitable_for: "Good for intermediates — good variety, but currents and traffic need awareness."
          hazards: "Significant tidal currents in Carrick Roads; heavy yacht/commercial traffic; submerged rocks near headlands; moored vessels."
          wind:
            ideal: [[168.75, 191.25], [213.75, 236.25], [303.75, 326.25]]   # S, SW, NW
            ok: []
            gusty: []
            offshore: []
          tide_rule: { best: high, avoid_hw_hours: 0, avoid_lw_hours: 0, rising_only: false }
      sub_note: >-
        Gylly and RCYC aren't independently scored — their wind/tide numbers above
        are for reference only, not fed into this dashboard's scoring engine.


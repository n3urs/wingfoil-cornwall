# Cornwall wing foiling spot rules.
#
# EDIT THIS FILE as you learn each spot — it is the whole brain of the dashboard.
# Nothing else needs changing to re-tune the scoring.
#
# ---------------------------------------------------------------------------
# wind.ideal / wind.ok / wind.gusty
#   Arcs of wind ORIGIN direction in degrees, clockwise, [from, to].
#   Arcs may wrap through 0 (e.g. [303.75, 11.25] means NW -> NNW -> N).
#
#   Arcs are snapped to 16-point compass sector boundaries so the label the
#   dashboard shows always agrees with how it scored. The sector edges are
#   multiples of 22.5 offset by 11.25:
#     N   348.75-11.25    NE   33.75-56.25    E   78.75-101.25   SE  123.75-146.25
#     NNE  11.25-33.75    ENE  56.25-78.75    ESE 101.25-123.75  SSE 146.25-168.75
#     S   168.75-191.25   SW  213.75-236.25   W   258.75-281.25  NW  303.75-326.25
#     SSW 191.25-213.75   WSW 236.25-258.75   WNW 281.25-303.75  NNW 326.25-348.75
#   Keep to these numbers when you edit, or a spot can read "NW" and still score
#   as merely "ok".
#   ideal -> 1.00   ok -> 0.62   outside both -> tapers to 0 over 15 deg
#   gusty -> multiplies the direction score by 0.85 (side/offshore over land)
#   offshore -> hard safety cap; score is capped at 0.25 and a warning is shown
#
# tide.best        one of: any | low | mid | high
# tide.avoid_hw_hours / avoid_lw_hours
#                  hours either side of HW/LW where the spot is unusable (0 = off)
# tide.rising_only true = ebb is dangerous here, ebb scores are crushed
# tide.flow_penalty  0-1, how badly strong mid-tide tidal stream hurts this spot
#
# swell_exposure   0 = no open-ocean swell reaches here, 1 = full Atlantic
# character        flatwater | estuary | beach_break — drives the wave-day logic
# wave_school      true = a sensible place to LEARN wave riding on a clean small day
#
# guide            optional — free text for the "Guide" panel in the UI, not used by
#                   the scoring engine at all. Fields: overview (list of paragraphs),
#                   ideal_wind, wind_speed, tide, swell, overall, crowds, suitable_for,
#                   hazards, access, parking (all plain strings), and sources (list of
#                   site names the guide was collated from). Omit the whole block if
#                   nothing's been written up yet — the UI just hides the Guide button.
# ---------------------------------------------------------------------------

spots:
  - id: daymer
    name: DAYMER BAY
    lat: 50.5620
    lon: -4.9270
    character: estuary
    swell_exposure: 0.25
    faces: 320          # compass bearing the open water/swell arrives from
    wave_school: false
    wind:
      ideal: [[303.75, 11.25], [168.75, 236.25]]   # NW-NNW-N, and S-SSW-SW
      ok: [[258.75, 303.75], [11.25, 33.75]]       # W-WNW (dead onshore), NNE
      gusty: [[258.75, 303.75]]
      offshore: [[33.75, 146.25]]                  # NE-E-SE blows off the land
    tide:
      best: any
      avoid_hw_hours: 0
      avoid_lw_hours: 0
      rising_only: false
      flow_penalty: 0.45                 # ebb rips out of the Camel at up to 8kn
    notes:
      - "Camel estuary ebb runs to 8kn — avoid mid-ebb, it will take you out to sea."
      - "wingfoilkit.com: worst at MID tide specifically if wind is against tide — rips out"
      - "and makes balancing/starting tricky. Not just 'avoid ebb', the mid-tide window is"
      - "the sharpest bit of it."
      - "Very shallow: wade out a fair way before you drop the 900 on."
      - "W is dead onshore and gusty. NW is the money direction."
      - "Rocks either side of the channel, boat traffic from Rock/Padstow ferries — keep clear."
      - "Beach can get very busy; at high springs there's not much beach left."

  - id: watergate
    name: WATERGATE BAY
    lat: 50.4430
    lon: -5.0430
    character: beach_break
    swell_exposure: 1.0
    faces: 300          # compass bearing the open water/swell arrives from
    wave_school: true
    wind:
      ideal: [[258.75, 11.25]]                     # W-WNW-NW-NNW-N: N holds the waves up clean
      ok: [[168.75, 258.75]]                       # S-SSW-SW-WSW
      gusty: []
      offshore: [[11.25, 168.75]]                  # NNE round to SSE
    tide:
      best: low
      avoid_hw_hours: 2                  # beach disappears at HW
      avoid_lw_hours: 0
      rising_only: false
      flow_penalty: 0.0
    notes:
      - "No beach 2hrs either side of HW — plan the exit before you go out."
      - "Low tide + N wind is the classic: clean wind, waves held up, 4km of sand."
      - "Full Atlantic exposure. Big swell here is a proper washing machine."
      - "knotnow.co.uk: high cliffs cause wind turbulence near them, on top of the tide"
      - "cut-off risk — two separate hazards at the same edge of the beach."
    guide:
      overview:
        - >-
          A two-mile stretch of golden sand just north of Newquay. Home to the Extreme
          Academy and a major UK kite/wing/surf hub — but big enough that a quiet peak
          is findable even when the main access point is busy.
        - >-
          Picks up more swell than most Cornish beaches, so it's the reliable choice
          for "real" wave conditions rather than flat water.
      ideal_wind: "SW, W, NW — the Newquay wave magnet. SW is side-on rather than square."
      wind_speed: "15-22kn for stable flight and small swell; 25kn+ needs a 3m or smaller wing."
      tide: "Best at low tide (+/-2hrs). Heavy and hard to launch at full high water."
      swell: "Punchy waves, clean Atlantic wind."
      overall: "Excellent. World-class wave destination with massive space and clean Atlantic winds."
      crowds: "Vibrant, very high — one of the busiest beaches in Cornwall. Zoned areas help manage it."
      suitable_for: "Intermediate to advanced. Powerful swell and rips require respect and skill."
      hazards: >-
        High cliffs cause wind turbulence near them. Being cut off by the tide against
        the cliffs is a serious risk — always check tide times. No-go for 2-4 hours
        around high tide.
      access: "Poseidon Watersports run kite/wing/foil/prone/tow coaching here and elsewhere on request."
      parking: "Watergate Bay car park, TR8 4AD."
      sources: ["knotnow.co.uk", "poseidon-watersports.com"]


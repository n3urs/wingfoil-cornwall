  - id: marazion
    name: MARAZION
    lat: 50.1245
    lon: -5.4735
    character: flatwater
    swell_exposure: 0.45
    faces: 170          # compass bearing the open water/swell arrives from
    wave_school: false
    wind:
      # wingfoilkit.com: best WSW, workable "E through S/W to WNW-N". NE-ENE-E is offshore.
      ideal: [[146.25, 258.75]]                    # SSE-S-SSW-SW-WSW
      ok: [[258.75, 11.25], [78.75, 146.25]]       # W-WNW-NW-NNW-N, and E-ESE-SE
      gusty: [[258.75, 303.75], [101.25, 146.25]]  # W-WNW and ESE-SE: flat but gusty
      offshore: [[11.25, 78.75]]                   # NNE-NE-ENE
    tide:
      best: high
      avoid_hw_hours: 0
      avoid_lw_hours: 0
      rising_only: false
      flow_penalty: 0.0
    notes:
      - "wingfoilkit.com calls it rideable at all states of the tide — but the shore break"
      - "at the seawall builds as the tide floods, and gets properly destructive with swell"
      - "running. Ease off near HW if there's any size in the water."
      - "Foil launching is easiest mid-to-high tide: the beach shelves steeply and gets deep"
      - "within a few metres. At low tide it's soft flat sand — a long slog out before there's"
      - "enough water to foil."
      - "Concrete outfall in front of the Hoxton Special watersports centre — know where it is."
      - "Long Rock reef to the west, plus rocky patches exposed at low tide."
      - "Seaweed in the shore break and on the beach can foul the foil launching/landing."
    guide:
      overview:
        - >-
          Marazion Station House, opposite St Michael's Mount, is one of Cornwall's
          iconic watersports spots. South-facing with a stunning backdrop, it works
          in a wide range of conditions. A Pay & Display car park sits right at the
          top of the sea wall with toilets, a pub and a cafe on site.
        - >-
          The beach changes character with the tide: sand/pebble/shingle up top, a
          flat shallow sandy playground mid-tide, and a short powerful shore break can
          build on the shingle bank as the tide floods, especially with swell running.
        - >-
          Angus at the Hoxton Special (right of the Station House Inn) is the friendly
          local face — kite tuition, SUP hire, and up-to-date reports including a live
          webcam when the centre's open.
      ideal_wind: "WSW is the single best direction; wide SSE-S-SSW-SW-WSW window works well."
      wind_speed: "15-25kn is the sweet spot; 4-5m wings in lighter air, 3m past 28kn."
      tide: >-
        wingfoilkit.com calls it rideable at all states of the tide, but foil launching
        is genuinely easiest mid-to-high tide (steep shelf, deep quickly) — at low tide
        it's a long slog out over soft flat sand.
      swell: "South-facing — works when the whole north coast is blown out or offshore."
      overall: "Excellent. Mount's Bay hub with clean winds and a spectacular backdrop."
      crowds: "Friendly, high. A major community hub, very popular on good forecasts."
      suitable_for: "Good for all levels. The variety of conditions means there's something for everyone."
      hazards: >-
        Concrete outfall in front of the Hoxton Special. Long Rock reef to the west,
        plus rocky patches at low tide. Seaweed in the shore break can foul a foil.
        Shore break at the seawall builds as the tide floods and gets destructive with
        any swell running.
      access: "Three access points down the sea defences from the car park, most popular next to the Station pub."
      parking: "Marazion Station car park; also Folly Fields (east) and Long Rock car park (west)."
      sources: ["wingfoilkit.com", "knotnow.co.uk"]

  - id: helford
    name: HELFORD RIVER SAILING CLUB
    lat: 50.0913            # Helford Passage, north bank — estimate, nudge if the map dot looks wrong
    lon: -5.1265
    character: estuary
    swell_exposure: 0.05    # fully sheltered river reach — chop and boat wake only
    wave_school: false
    wind:
      # Oscar's own correction, 2026-08-08: the river runs east-west at Helford
      # Passage, so it needs an EASTERLY funnelling straight down the valley —
      # not knotnow.co.uk's S/SW claim (wrong, or describing a different reach).
      # Wind from the sides gets blocked/turbulent behind the tree-lined banks.
      ideal: [[78.75, 101.25]]                   # E — square down the valley
      ok: [[56.25, 78.75], [101.25, 123.75]]     # ENE, ESE
      gusty: [[56.25, 78.75], [101.25, 123.75]]  # off-axis = wind clipping the trees
      offshore: []                               # not vouched for as dangerous, just blocked/no wind
    tide:
      best: high
      avoid_hw_hours: 0
      avoid_lw_hours: 0
      rising_only: false
      flow_penalty: 0.25                 # "significant tidal currents" per the guide
    notes:
      - "Wind must funnel straight down the river — the valley points due east, so it"
      - "needs an EASTERLY. Off-axis directions get blocked or turned rough by the"
      - "tree-lined banks either side."
      - "Tide numbers still from knotnow.co.uk, 2026-08-08 — untested by Oscar, only the"
      - "wind direction has been corrected so far."
      - "High tide (+/-2hrs) is best — optimal depth and easier launching."
      - "Numerous rocky patches/mudflats and moored vessels — narrow channels, know the layout."
    guide:
      overview:
        - >-
          Helford River Sailing Club, established 1948, sits at Helford Passage on the
          north bank of the River Helford — a sheltered estuary environment with a mix
          of flat-water reaches and manageable tidal currents. Famous for its scenery
          and peaceful atmosphere: a scenic "cruising" playground for exploring the
          river reaches in a protected coastal setting.
      ideal_wind: "E — square down the valley. Off-axis wind gets blocked or turned gusty by the tree-lined banks."
      wind_speed: "12-18kn for beginners; 20-28kn for advanced."
      tide: "Best at high tide (+/-2hrs) — optimal depth and easier launching."
      swell: "Estuary chop and boat wake only."
      overall: "Excellent. A stunningly beautiful maritime hub with a focus on traditional sailing."
      crowds: "Friendly, low. A welcoming village club with supportive local membership — rarely crowded, but boat moorings are numerous."
      suitable_for: "Good for intermediates. Currents and mud require awareness."

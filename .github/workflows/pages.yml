name: Build and deploy dashboard

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours, offset from the hour so it's not queued behind everyone else's :00 jobs
  push:
    branches: [main]
  workflow_dispatch: {}      # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # let a run finish rather than publishing a half-built snapshot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Log in to Copernicus Marine
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -n "$COPERNICUSMARINE_SERVICE_USERNAME" ]; then
            copernicusmarine login --force-overwrite
          else
            echo "No Copernicus credentials set — swell will fall back to Open-Meteo. See README."
          fi

      - name: Build the dashboard
        env:
          ADMIRALTY_API_KEY: ${{ secrets.ADMIRALTY_API_KEY }}
        run: python tools/build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
